version: '3.8'

# Cube3D Single-GPU Setup
#
# This configuration runs all Triton models on a single GPU.
# Use this for development or when you only have one GPU available.
#
# Usage:
#   docker-compose -f docker-compose.single-gpu.yml up -d

services:
  # ==========================================================================
  # TEMPORAL INFRASTRUCTURE
  # ==========================================================================

  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cube3d-net

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cube3d-net

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    networks:
      - cube3d-net

  # ==========================================================================
  # SINGLE TRITON SERVER (ALL MODELS)
  # ==========================================================================

  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=1"]
    volumes:
      - ./triton/models:/models:ro
      - ../:/models/cube3d:ro
      - ${WEIGHTS_PATH:-./weights}:/models/weights:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '8gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s  # All models take time to load
    networks:
      - cube3d-net

  # ==========================================================================
  # APPLICATION SERVICES
  # ==========================================================================

  worker:
    build:
      context: .
      dockerfile: temporal/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      triton:
        condition: service_healthy
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TASK_QUEUE=cube3d-mesh-generation
      - TEMPORAL_NAMESPACE=default
      # All models on same Triton server
      - CLIP_TRITON_URL=triton:8001
      - GPT_TRITON_URL=triton:8001
      - MESH_TRITON_URL=triton:8001
    restart: unless-stopped
    networks:
      - cube3d-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TASK_QUEUE=cube3d-mesh-generation
      - TEMPORAL_NAMESPACE=default
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - cube3d-net

volumes:
  postgresql-data:

networks:
  cube3d-net:
    driver: bridge
