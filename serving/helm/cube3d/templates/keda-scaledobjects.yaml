{{- if .Values.keda.enabled }}
# =============================================================================
# KEDA ScaledObjects for Temporal Queue-Based Autoscaling
# =============================================================================

# -----------------------------------------------------------------------------
# Triton CLIP ScaledObject
# -----------------------------------------------------------------------------
{{- if and .Values.triton.clip.enabled .Values.triton.clip.autoscaling.kedaEnabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "cube3d.fullname" . }}-triton-clip-scaler
  labels:
    {{- include "cube3d.triton.labels" . | nindent 4 }}
    app.kubernetes.io/stage: clip
spec:
  scaleTargetRef:
    name: {{ include "cube3d.fullname" . }}-triton-clip
  minReplicaCount: {{ .Values.triton.clip.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.triton.clip.autoscaling.maxReplicas }}
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    {{- range .Values.triton.clip.autoscaling.kedaTriggers }}
    - type: {{ .type }}
      metadata:
        {{- if .metadata.taskQueue }}
        address: {{ include "cube3d.temporalHost" $ }}
        namespace: {{ $.Values.workers.temporalNamespace }}
        taskQueue: {{ .metadata.taskQueue }}
        targetBacklogCount: {{ .metadata.targetBacklogCount | quote }}
        {{- end }}
      {{- if $.Values.keda.temporalAuth.enabled }}
      authenticationRef:
        name: {{ include "cube3d.fullname" $ }}-temporal-auth
      {{- end }}
    {{- end }}
---
{{- end }}

# -----------------------------------------------------------------------------
# Triton GPT ScaledObject (BOTTLENECK - scales aggressively)
# -----------------------------------------------------------------------------
{{- if and .Values.triton.gpt.enabled .Values.triton.gpt.autoscaling.kedaEnabled }}
