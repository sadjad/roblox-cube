{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
# ServiceMonitor for Triton metrics
{{- if .Values.triton.clip.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cube3d.fullname" . }}-triton-clip
  labels:
    {{- include "cube3d.triton.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cube3d.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: triton
      app.kubernetes.io/stage: clip
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
---
{{- end }}

