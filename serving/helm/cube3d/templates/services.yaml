# -----------------------------------------------------------------------------
# API Gateway Service
# -----------------------------------------------------------------------------
{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cube3d.fullname" . }}-api
  labels:
    {{- include "cube3d.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cube3d.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
