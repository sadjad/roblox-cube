# =============================================================================
# Services for Cube3D Components
# =============================================================================

# -----------------------------------------------------------------------------
# Triton CLIP Service
# -----------------------------------------------------------------------------
{{- if .Values.triton.clip.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cube3d.fullname" . }}-triton-clip
  labels:
    {{- include "cube3d.triton.labels" . | nindent 4 }}
    app.kubernetes.io/stage: clip
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8001
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "cube3d.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: triton
    app.kubernetes.io/stage: clip
---
{{- end }}

