# Nginx Load Balancer for CLIP Triton Replicas
#
# This configuration load-balances gRPC requests across CLIP Triton instances.
# Docker Compose DNS resolves "triton-clip" to all replica IPs.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # gRPC requires HTTP/2
    upstream triton_clip_grpc {
        # Docker DNS resolves to all replicas
        # least_conn for better load distribution with varying request times
        least_conn;
        server triton-clip:8001;
        keepalive 32;
    }

    server {
        listen 8001 http2;

        location / {
            grpc_pass grpc://triton_clip_grpc;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;

            # Timeouts for inference
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
