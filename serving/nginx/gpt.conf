# Nginx Load Balancer for GPT Triton Replicas
#
# GPT is the bottleneck - this load balancer is critical for throughput.
# Uses least_conn to route to the least busy replica.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream triton_gpt_grpc {
        # least_conn is crucial for GPT since requests take 10+ seconds
        # This ensures new requests go to idle replicas
        least_conn;
        server triton-gpt:8001;
        keepalive 64;
    }

    server {
        listen 8001 http2;

        location / {
            grpc_pass grpc://triton_gpt_grpc;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;

            # Long timeouts for autoregressive generation
            grpc_read_timeout 600s;   # 10 minutes
            grpc_send_timeout 60s;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
