# Nginx Load Balancer for Mesh Decoder Triton Replicas
#
# Mesh decoding takes ~3-5 seconds per request.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream triton_mesh_grpc {
        least_conn;
        server triton-mesh:8001;
        keepalive 32;
    }

    server {
        listen 8001 http2;

        location / {
            grpc_pass grpc://triton_mesh_grpc;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;

            # Moderate timeouts for mesh decoding
            grpc_read_timeout 300s;   # 5 minutes
            grpc_send_timeout 60s;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
